name: Refresh contracts and grants

on:
  schedule:
    # 09:15 UTC daily. SAM.gov publishes the extract around 03:30 UTC; this leaves
    # a wide margin for a late upload and lands before US business hours.
    - cron: "15 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # WHY 20: the download is ~210 MB and the build takes seconds; anything past
    # this is a hung transfer, and the next day's run will try again.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run unit tests
        run: npm test

      - name: Download SAM.gov extract
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -o "$RUNNER_TEMP/sam.csv" \
            "https://s3.amazonaws.com/falextracts/Contract%20Opportunities/datagov/ContractOpportunitiesFullCSV.csv"
          ls -la "$RUNNER_TEMP/sam.csv"

      - name: Rebuild data.json
        run: node scripts/build-sam.js --csv "$RUNNER_TEMP/sam.csv" --data data.json

      - name: Refresh Miami-Dade County bids
        # Keeps the previous county rows if the county site is down.
        run: node scripts/build-miami-dade.js --data data.json

      - name: Refresh grants
        # Keeps the previous grants.json if Grants.gov is down.
        run: node scripts/build-grants.js --out grants.json

      - name: Split the first-paint snapshot
        # build-sam and build-miami-dade also split. This run is the one that
        # publishes, so the committed halves always match data.json, including
        # when the county feed is down and that script leaves the file alone.
        run: node scripts/split-data.js --data data.json

      - name: Sanity-check the result
        # WHY 2000: a normal day has 10,000+ open federal notices. Far fewer means a
        # truncated or changed extract; keep yesterday's data rather than publish it.
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { splitRows, mergeSnapshot } from "./snapshot.js";
            const d = JSON.parse(readFileSync("data.json", "utf8"));
            const pri = JSON.parse(readFileSync("data-priority.json", "utf8"));
            const rest = JSON.parse(readFileSync("data-rest.json", "utf8"));
            const fed = d.meta.by_source.find((s) => s.label === "sam.gov")?.value ?? 0;
            console.log("federal rows:", fed);
            if (fed < 2000) { console.error("Too few federal notices; refusing to publish."); process.exit(1); }
            const expect = splitRows(d.rows, d.meta.dicts, d.meta.today);
            if (pri.rows.length !== expect.first.length || rest.rows.length !== expect.rest.length || pri.rows.length + rest.rows.length !== d.rows.length) {
              console.error("Split files do not match data.json."); process.exit(1);
            }
            if (JSON.stringify(pri.meta) !== JSON.stringify(d.meta) || rest.built_at !== d.meta.built_at) {
              console.error("Priority meta or rest snapshot day does not match data.json."); process.exit(1);
            }
            const merged = mergeSnapshot(pri, rest);
            if (!merged?.complete || merged.rows.length !== d.rows.length) {
              console.error("Split halves do not merge back to the full snapshot."); process.exit(1);
            }
            console.log("split ok:", pri.rows.length, "first,", rest.rows.length, "rest");
          '

      - name: Commit if changed
        run: |
          git add -- data.json data-priority.json data-rest.json grants.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "govbid-refresh"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore(data): Daily SAM.gov, Miami-Dade and Grants.gov refresh"
          git push
